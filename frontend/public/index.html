<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  
  <!-- PWA Primary Meta Tags -->
  <title>FindFlix - Discover Movies & TV Shows</title>
  <meta name="title" content="FindFlix - Discover Movies & TV Shows" />
  <meta name="description" content="Discover movies and TV shows with friends. Swipe, match, and find your next watch together." />
  
  <!-- iOS Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FindFlix" />
  
  <!-- iOS Icons -->
  <link rel="apple-touch-icon" href="/icon.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="/icon.png" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.png" />
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#000000" />
  <meta name="msapplication-TileColor" content="#000000" />
  <meta name="msapplication-navbutton-color" content="#e50914" />
  
  <!-- Splash Screen -->
  <meta name="mobile-web-app-capable" content="yes" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="FindFlix - Discover Movies & TV Shows" />
  <meta property="og:description" content="Discover movies and TV shows with friends. Swipe, match, and find your next watch together." />
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="FindFlix - Discover Movies & TV Shows" />
  <meta name="twitter:description" content="Discover movies and TV shows with friends. Swipe, match, and find your next watch together." />
  
  <style>
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    #root {
      display: flex;
      min-height: 100vh;
      background-color: #000000;
    }
    
    /* iOS Safe Area Support */
    @supports (padding: max(0px)) {
      body {
        padding-left: max(0px, env(safe-area-inset-left));
        padding-right: max(0px, env(safe-area-inset-right));
      }
    }
  </style>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
</html>
